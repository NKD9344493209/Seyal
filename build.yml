name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report errors
        if: failure()
        run: |
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |error:|What went wrong|Could not|FAILURE|Execution failed' -A 2 build.log | head -150 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | head -40 | while IFS= read -r line; do
            msg="${line#e: }"
            echo "::error title=Kotlin::${msg//$'\n'/ }"
          done || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Seyal-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Seyal-apk
          path: Seyal-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Seyal build ${{ github.run_number }}
          body: Debug APK. Open this page on your phone, download the .apk and install it.
          files: Seyal-*.apk
          prerelease: true
