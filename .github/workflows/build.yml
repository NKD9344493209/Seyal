name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors
        if: failure()
        run: grep -nE "^e: |error:|FAILURE|What went wrong" -A 3 build.log | head -200 || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Seyal-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Seyal-apk
          path: Seyal-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Seyal build ${{ github.run_number }}
          body: "Debug APK. Download Seyal-${{ github.run_number }}.apk on your phone and install it."
          files: Seyal-*.apk
          prerelease: true
